{% extends "base.html" %}

{% block title %}Bad Request - TrabahoPH{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="error-container">
                <h1 class="display-1 fw-bold text-warning">400</h1>
                <h2 class="mb-4">Bad Request</h2>
                <p class="text-muted mb-4">
                    Your request was invalid or malformed. Please check the information you submitted and try again.
                </p>
                
                <div class="error-actions">
                    <a href="{% url 'index' %}" class="btn btn-primary btn-lg me-2">
                        <i class="fas fa-home"></i> Go Home
                    </a>
                    <a href="javascript:history.back()" class="btn btn-outline-primary btn-lg">
                        <i class="fas fa-arrow-left"></i> Go Back
                    </a>
                </div>
                
                <hr class="my-4">
                
                <p class="text-muted small">
                    <strong>Need help?</strong> <a href="{% url 'index' %}#contact">Contact us</a>
                </p>
            </div>
        </div>
    </div>
</div>

<style>
.error-container {
    padding: 50px 0;
}

.error-actions {
    margin-top: 30px;
}
</style>
{% endblock %}
